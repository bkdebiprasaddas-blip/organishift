<svg xmlns="http://www.w3.org/2000/svg" version="1.1" width="370" height="64" viewBox="0 0 370 64" xml:space="preserve">
<desc>OrganiShift Enterprise Horizontal Logo (Zero Clipping Safe Canvas)</desc>
<defs>
  <!-- Rich Royal Indigo to Sapphire Blue Badge Gradient -->
  <linearGradient id="proGradSafeHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#4f46e5" />
    <stop offset="50%" stop-color="#3b82f6" />
    <stop offset="100%" stop-color="#1d4ed8" />
  </linearGradient>

  <!-- Metallic Chevron Accent Gradient -->
  <linearGradient id="chevGradSafeHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#ffffff" />
    <stop offset="100%" stop-color="#cbd5e1" />
  </linearGradient>

  <!-- Sky Blue Velocity Accent Gradient -->
  <linearGradient id="skyGradSafeHoriz" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" stop-color="#38bdf8" />
    <stop offset="100%" stop-color="#0284c7" />
  </linearGradient>

  <!-- Soft Drop Shadow -->
  <filter id="proGlowSafeHoriz" x="-30%" y="-30%" width="160%" height="160%">
    <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#4f46e5" flood-opacity="0.32" />
  </filter>

  <!-- Side Ticket Cutout Mask for 54x58 Icon Pass -->
  <mask id="proPassCutoutSafeHoriz">
    <rect x="0" y="0" width="54" height="58" rx="12" fill="#ffffff" />
    <circle cx="0" cy="29" r="5" fill="#000000" />
    <circle cx="54" cy="29" r="5" fill="#000000" />
  </mask>
</defs>

<!-- ========================================================= -->
<!-- 1. LEFT EMBLEM: VIP EVENT PASS (54x58) [X: 10 to 64]      -->
<!-- ========================================================= -->
<g transform="translate(10, 3)" filter="url(#proGlowSafeHoriz)">
  <!-- Container Pass -->
  <rect x="0" y="0" width="54" height="58" fill="url(#proGradSafeHoriz)" mask="url(#proPassCutoutSafeHoriz)" />

  <!-- Top Lanyard Slot Ring -->
  <rect x="21" y="4" width="12" height="3" rx="1.5" fill="#ffffff" opacity="0.85" />

  <!-- Dashed Tear Line -->
  <line x1="6" y1="29" x2="48" y2="29" stroke="#ffffff" stroke-width="1" stroke-dasharray="3 2" opacity="0.5" />

  <!-- Orbit Rings -->
  <circle cx="27" cy="29" r="15" stroke="url(#skyGradSafeHoriz)" stroke-width="1.2" fill="none" opacity="0.4" stroke-dasharray="5 3" />
  <circle cx="27" cy="29" r="19" stroke="#ffffff" stroke-width="0.8" fill="none" opacity="0.25" />

  <!-- Primary Chevron -->
  <path d="M 18 39 L 27 18 L 31 18 L 40 39 L 35 39 L 29 25 L 23 39 Z" fill="url(#chevGradSafeHoriz)" />

  <!-- Sky Velocity Chevron -->
  <path d="M 13 33 L 22 13 L 26 13 L 35 33 L 30 33 L 24 18 L 18 33 Z" fill="url(#skyGradSafeHoriz)" opacity="0.9" />

  <!-- Barcode Lines -->
  <g transform="translate(12, 47)" opacity="0.75">
    <rect x="0" y="0" width="1.5" height="5" fill="#ffffff" />
    <rect x="3" y="0" width="0.8" height="5" fill="#ffffff" />
    <rect x="5" y="0" width="2" height="5" fill="#ffffff" />
    <rect x="8" y="0" width="1" height="5" fill="#ffffff" />
    <rect x="10" y="0" width="2.5" height="5" fill="#ffffff" />
    <rect x="14" y="0" width="1" height="5" fill="#ffffff" />
    <rect x="16" y="0" width="2" height="5" fill="#ffffff" />
    <rect x="19" y="0" width="1" height="5" fill="#ffffff" />
    <rect x="21" y="0" width="2.5" height="5" fill="#ffffff" />
    <rect x="25" y="0" width="1" height="5" fill="#ffffff" />
    <rect x="27" y="0" width="2" height="5" fill="#ffffff" />
  </g>
</g>

